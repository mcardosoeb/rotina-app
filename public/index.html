<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1720">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rotina">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <title>Rotina</title>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="countdown" id="countdown"></div>
      <div class="date-nav">
        <button class="icon-btn" id="prevDay" aria-label="Dia anterior">‹</button>
        <button class="date-label" id="dateLabel"></button>
        <button class="icon-btn" id="nextDay" aria-label="Próximo dia">›</button>
      </div>
    </div>
    <div class="topbar-right">
      <span class="sync" id="syncDot" title="Sincronização"></span>
      <button class="icon-btn" id="openSettings" aria-label="Ajustes">⚙︎</button>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button data-tab="hoje" class="active"><span>☑</span>Hoje</button>
    <button data-tab="peso"><span>⚖</span>Peso</button>
    <button data-tab="semana"><span>📊</span>Semana</button>
    <button data-tab="checkin"><span>✉</span>Check-in</button>
  </nav>

  <div class="modal hidden" id="pinModal">
    <div class="modal-card">
      <h2>Digite seu PIN</h2>
      <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN">
      <label class="remember"><input type="checkbox" id="pinRemember" checked> Lembrar neste aparelho</label>
      <p class="muted small" id="pinError"></p>
      <button class="btn primary block" id="pinOk">Entrar</button>
    </div>
  </div>

  <input type="date" id="datePicker" class="hidden-date">
  <div class="toast hidden" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
